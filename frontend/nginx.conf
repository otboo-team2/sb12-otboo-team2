# 프론트 정적 파일 + API 리버스 프록시.
# upstream 이름(app-api · app-realtime)은 compose 의 서비스 이름과 같아야 한다.

server {
    listen 80;
    server_name _;

    # 도커 내장 DNS. proxy_pass 에 변수를 쓰면 nginx 가 이름을 요청 시점에 해석한다.
    #
    # 변수 없이 이름을 그대로 적으면 nginx 는 기동할 때 해석하고, 못 찾으면
    # 아예 뜨지 않는다("host not found in upstream"). 백엔드가 잠깐 재시작하는 사이에
    # 프론트까지 같이 죽는다. 변수로 넘기면 그동안 502 만 나고 컨테이너는 살아 있다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api      http://app-api:8080;
    set $realtime http://app-realtime:8081;

    # 업로드 이미지(프로필·의상). 백엔드의 multipart 상한 12MB 과 맞춘다.
    # 여기가 더 작으면 백엔드에 닿기도 전에 413 이 난다.
    client_max_body_size 12m;

    # 프록시 공통 헤더. 각 location 이 proxy_set_header 를 하나라도 쓰면
    # 이 값들을 물려받지 못하므로, 그런 곳(/ws · /api/sse)에는 다시 적어뒀다.
    #
    # ⚠️ X-Forwarded-Proto 가 없으면 스프링이 만드는 OAuth redirect_uri 가 http 로 나가
    #    HTTPS 환경에서 구글이 거절한다. 앱 쪽 server.forward-headers-strategy 와 한 쌍이다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── 실시간 (app-realtime) ────────────────────────────────────────────
    # SSE. 버퍼링을 끄지 않으면 nginx 가 이벤트를 모았다가 내보내서 알림이 늦게 뜬다.
    location /api/sse {
        proxy_pass $realtime;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # WebSocket(DM). Upgrade 헤더를 넘기지 않으면 핸드셰이크가 400 으로 끝난다.
    location /ws {
        proxy_pass $realtime;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 1h;
    }

    # ── API (app-api) ───────────────────────────────────────────────────
    location /api {
        proxy_pass $api;
    }

    # 소셜 로그인 시작. /oauth2/authorization/google
    location /oauth2 {
        proxy_pass $api;
    }

    # 구글이 돌려보내는 콜백. 이게 빠지면 로그인 막판에 404 가 난다.
    location /login/oauth2 {
        proxy_pass $api;
    }

    # 업로드된 이미지. 백엔드가 /images 로 서빙한다(otboo.storage.base-url).
    location /images {
        proxy_pass $api;
    }

    # ── 정적 파일 ────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        # SPA 라우팅. 이게 없으면 /clothes 에서 새로고침했을 때 404 가 난다.
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 산출물은 내용이 바뀌면 이름이 바뀐다. 길게 캐시해도 안전하다.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
