# 대시보드 JSON 을 파일에서 읽어 자동 등록한다.
# UI 에서 만든 대시보드는 컨테이너를 지우면 사라진다. 파일로 두면 git 에 남는다.
apiVersion: 1

providers:
  - name: otboo
    type: file
    # UI 에서 수정하면 다음 재시작 때 파일 내용으로 되돌아간다.
    # 바꾸고 싶으면 UI 에서 Export 한 JSON 을 파일에 덮어써서 커밋한다.
    disableDeletion: false
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
