# 로컬 개발 인프라. clone 후 `docker compose up -d` 하나로 개발 환경이 서야 한다.
services:
  mysql:
    # 8.4 는 Flyway 11.7 의 검증 범위 밖이라 기동할 때마다 경고가 뜬다.
    # RDS 에서도 8.0 이 가장 흔하다.
    image: mysql:8.0
    container_name: otboo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-otboo}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-otboo}
      MYSQL_USER: ${MYSQL_USER:-otboo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-otboo}
      TZ: UTC
    command:
      # 이모지가 들어간다(피드 내용·의상 이름). utf8 은 3바이트라 이모지를 못 담는다.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # DB·JVM·응답을 전부 UTC 로 맞춘다. 이 값들이 어긋나면 시간이 밀린다.
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-otboo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: otboo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── 피드 검색 (Elasticsearch) ─────────────────────────────────────────────
  # 공식 이미지에는 한국어 형태소 분석기(nori)가 없다. 플러그인을 넣은 이미지를 직접 굽는다.
  # 최초 1회 `docker compose build elasticsearch` 가 필요하고, 그 뒤로는 캐시가 쓰인다.
  elasticsearch:
    build:
      context: ./docker/elasticsearch
    image: otboo-elasticsearch:8.18.8
    container_name: otboo-elasticsearch
    restart: unless-stopped
    environment:
      # 단일 노드. 로컬에서 replica 를 요구하면 인덱스가 영원히 yellow 로 남는다.
      discovery.type: single-node
      # 로컬 전용이라 TLS·인증을 끈다. 배포(AWS OpenSearch)에서는 절대 이렇게 두지 않는다.
      xpack.security.enabled: "false"
      # 기본 힙(1/2 메모리)은 개발 노트북에서 과하다. 색인량이 작아 512m 로 충분하다.
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # 디스크가 차면 ES 가 인덱스를 read-only 로 바꿔 색인이 조용히 실패한다.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      # yellow 까지 정상으로 본다. 단일 노드에서 green 은 replica 가 0 일 때만 나온다.
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ── 관측 (KAN-35) ─────────────────────────────────────────────────────────
  # 앱은 보통 호스트에서 bootRun 으로 뜨므로, 컨테이너에서 호스트를 가리켜 긁어간다.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: otboo-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 로컬은 오래 보관할 이유가 없다. 디스크만 먹는다.
      - --storage.tsdb.retention.time=7d
      # 그래프에서 시간 범위를 바꿔도 URL 이 남게 한다
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # 맥·윈도우 도커에는 이미 있지만 리눅스에는 없다. 없으면 앱을 못 찾는다.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: otboo-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # 로컬 전용이라 로그인을 끈다. 배포에서는 절대 이렇게 두지 않는다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      # 열자마자 개요 대시보드가 보이게 한다
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/otboo-overview.json
    ports:
      - "3000:3000"
    volumes:
      # 데이터소스·대시보드를 파일로 자동 등록한다. 팀원마다 UI 에서 설정할 필요가 없다.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  mysql-data:
  redis-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
