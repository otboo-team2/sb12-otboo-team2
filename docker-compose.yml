# 로컬 개발 인프라. clone 후 `docker compose up -d` 하나로 개발 환경이 서야 한다.
services:
  mysql:
    # 8.4 는 Flyway 11.7 의 검증 범위 밖이라 기동할 때마다 경고가 뜬다.
    # RDS 에서도 8.0 이 가장 흔하다.
    image: mysql:8.0
    container_name: otboo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-otboo}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-otboo}
      MYSQL_USER: ${MYSQL_USER:-otboo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-otboo}
      TZ: UTC
    command:
      # 이모지가 들어간다(피드 내용·의상 이름). utf8 은 3바이트라 이모지를 못 담는다.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # DB·JVM·응답을 전부 UTC 로 맞춘다. 이 값들이 어긋나면 시간이 밀린다.
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-otboo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: otboo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── 관측 (KAN-35) ─────────────────────────────────────────────────────────
  # 앱은 보통 호스트에서 bootRun 으로 뜨므로, 컨테이너에서 호스트를 가리켜 긁어간다.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: otboo-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 로컬은 오래 보관할 이유가 없다. 디스크만 먹는다.
      - --storage.tsdb.retention.time=7d
      # 그래프에서 시간 범위를 바꿔도 URL 이 남게 한다
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # 맥·윈도우 도커에는 이미 있지만 리눅스에는 없다. 없으면 앱을 못 찾는다.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: otboo-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # 로컬 전용이라 로그인을 끈다. 배포에서는 절대 이렇게 두지 않는다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      # 열자마자 개요 대시보드가 보이게 한다
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/otboo-overview.json
    ports:
      - "3000:3000"
    volumes:
      # 데이터소스·대시보드를 파일로 자동 등록한다. 팀원마다 UI 에서 설정할 필요가 없다.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
