// REST API 애플리케이션
dependencies {
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.kafka:spring-kafka'
    // 비밀번호 초기화 임시 비밀번호 발송. SPRING_MAIL_HOST 가 없으면 로그로 대체된다.
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // 소셜 로그인. /oauth2/authorization/{provider} 와 /login/oauth2/code/{provider} 를 제공한다.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // 비공개 S3 객체 저장 기반. 기존 ImageStorage에는 연결하지 않고 명시적으로 켤 때만 빈을 만든다.
    implementation platform('software.amazon.awssdk:bom:2.31.7')
    implementation 'software.amazon.awssdk:s3'

    // 피드 검색. Spring Data 의 Repository/@Document 는 쓰지 않고 ElasticsearchClient 만 쓴다.
    // 검색 조건(커서·정렬·필터)이 스펙에 고정돼 있어 Repository 추상화가 오히려 방해가 된다.
    // starter 를 쓰는 이유는 spring.elasticsearch.* 로 클라이언트가 자동 구성되기 때문이다.
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    // 검색 통합 테스트는 실제 ES 컨테이너에 붙는다. nori 가 없는 공식 이미지로는
    // 한국어 분석 결과가 달라져 테스트가 운영을 대변하지 못한다(otboo-elasticsearch 이미지 사용).
    testImplementation 'org.testcontainers:elasticsearch'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.0'
}
