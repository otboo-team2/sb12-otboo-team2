<!doctype html>
<html lang="ko">
<head>
    <meta property="og:title" content="기본 재킷">
</head>
<body>
    <h1>기본 재킷</h1>
    <section class="product-detail">
        <img src="https://cdn.example.com/product-main.jpg" width="800" height="1000" alt="상품 대표 이미지">
        <img data-src="https://cdn.example.com/detail-front.jpg" width="800" height="1000" alt="상품 앞면">
        <img data-src="https://cdn.example.com/detail-back.jpg" width="800" height="1000" alt="상품 뒷면">
        <img srcset="https://cdn.example.com/srcset-first.jpg 1x, https://cdn.example.com/srcset-second.jpg 2x"
             width="800" height="1000" alt="상품 소재">
        <img src="https://cdn.example.com/logo.png" width="32" height="32" alt="브랜드 로고">
        <div class="review-images">
            <img src="https://cdn.example.com/review-user.jpg" width="800" height="1000" alt="구매 후기">
        </div>
        <div class="recommend-banner">
            <img src="https://cdn.example.com/recommend.jpg" width="800" height="1000" alt="추천 상품">
        </div>
        <img src="http://cdn.example.com/insecure.jpg" width="800" height="1000" alt="비허용 이미지">
        <img src="data:image/png;base64,AAAA" width="800" height="1000" alt="데이터 이미지">
    </section>
</body>
</html>
