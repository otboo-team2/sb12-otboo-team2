spring:
  application:
    name: otboo-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}   # 배포에서는 prod 로 덮어쓴다
  config:
    import: classpath:config/db.yml           # 공통 DB·인프라 설정 (common-core)
  jackson:
    time-zone: UTC                            # 응답은 UTC 기준 ISO-8601
  servlet:
    multipart:
      max-file-size: 10MB                     # 의상·프로필 이미지 업로드
      max-request-size: 12MB

otboo:
  # 업로드 이미지(프로필·의상). 지금은 로컬 디스크에 쓴다.
  # ⚠️ 인스턴스를 여러 개 띄우면 각자 다른 디스크에 저장돼 이미지가 반쪽만 보인다. S3 전환은 별도 티켓.
  storage:
    base-dir: ${STORAGE_BASE_DIR:./data/images}
    base-url: /images
    max-size: 5242880          # 5MB. 프론트(ProfileImageUpload)와 같은 값

  jwt:
    # 운영에서는 반드시 환경변수로 덮어쓴다. 최소 32바이트.
    secret: ${JWT_SECRET:otboo-local-development-secret-key-change-me-please}
    access-expiry: 30m
    refresh-expiry: 14d
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

  # ─────────── 외부 API 호출 정책 ───────────
  # 담당자는 자기 블록만 고치면 된다. 공통 자바 코드는 건드리지 않는다.
  # 블록이 없어도 defaults 로 동작하므로 앱이 안 뜨는 일은 없다.
  #
  # max-retries 기본값이 0 인 것은 의도적이다.
  #   재시도가 안전한 API 만(= 재호출해도 과금·중복 생성이 없는 API) 담당자가 올린다.
  external-api:
    defaults:
      connect-timeout: 3s
      read-timeout: 10s
      max-retries: 0
      backoff: 1s

    apis:
      # 류승지 — Pinterest 코디 추천
      pinterest:
        read-timeout: 10s
        max-retries: 0        # TODO(담당자): 조회만 하는 API 라면 2 로 올려도 안전합니다

      # 안소현 — 링크 추출 / 파싱
      link-extract:
        read-timeout: 10s
        max-retries: 0        # TODO(담당자): 상대 사이트 차단 정책 확인 후 결정

      # 박교현 — 추천 LLM
      llm:
        read-timeout: 60s     # TODO(담당자): 실제 응답 시간 재보고 조정
        max-retries: 0        # TODO(담당자): 재시도 = 토큰 재과금입니다. 올릴 거면 1 까지만
        daily-limit: 500      # TODO(담당자): 남은 크레딧 기준으로 확정. 없으면 무제한

      # 양정우 — 가상 피팅 AI
      # ⚠️ 생성에 10초~2분이 걸려 HTTP 요청 하나로 기다릴 수 없습니다.
      #    virtual_try_on_jobs 에 job 을 만들고 비동기로 처리하는 구조가 필요하고,
      #    이 설정은 그 안에서 일어나는 '호출 한 번'에만 적용됩니다.
      virtual-try-on:
        read-timeout: 120s
        max-retries: 0        # 재시도 = 재과금 + 결과물 중복 생성. 올리지 마세요

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized

---
# prod 에서는 관측 엔드포인트만 남기고 나머지를 닫는다
spring:
  config:
    activate:
      on-profile: prod

otboo:
  jwt:
    secret: ${JWT_SECRET}          # 기본값을 두지 않는다
    cookie-secure: true            # HTTPS 에서만 쿠키 전송
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
