spring:
  application:
    name: otboo-realtime
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: classpath:config/db.yml
  jackson:
    time-zone: UTC
  flyway:
    enabled: false          # 마이그레이션은 app-api 만 수행한다

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

otboo:
  jwt:
    secret: ${JWT_SECRET:otboo-local-development-secret-key-change-me-please}
    access-expiry: 30m
    refresh-expiry: 14d
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

sse:
  timeout: 1800000            # 30분
  event-queue-capacity: 1000  # 재연결 replay용 버퍼, 서버 전체 공용
  heartbeat-interval: 20000   # 20초

---
spring:
  config:
    activate:
      on-profile: prod

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
