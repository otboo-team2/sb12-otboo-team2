name: CD (images)

# dev·main 에 반영될 때마다 컨테이너 이미지를 만들어 GHCR 에 올린다.
#
# 배포(어디에 띄울지)는 아직 없다. 이미지를 먼저 쌓아두는 이유 —
# 배포 대상이 EC2 든 ECS 든 "이미지를 만들어 올린다"까지는 똑같고,
# 이 부분이 CD 작업량의 대부분이다. 대상이 정해지면 마지막 스텝만 붙이면 된다.
#
# 레지스트리를 GHCR 로 잡은 것도 같은 이유다. 레포에 딸려 있어 계정·권한을
# 따로 만들 필요가 없고, 나중에 ECR 로 옮겨도 태그 규칙은 그대로 쓴다.

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:

concurrency:
  group: cd-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write        # GHCR 푸시에 필요하다
  id-token: write        # AWS OIDC 인증에 필요하다

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # 하나가 깨져도 나머지는 만들어둔다. 어디가 문제인지 한 번에 보인다.
      fail-fast: false
      matrix:
        include:
          - image: app-api
            context: .
            file: Dockerfile
            module: app-api
          - image: app-realtime
            context: .
            file: Dockerfile
            module: app-realtime
          - image: app-batch
            context: .
            file: Dockerfile
            module: app-batch
          - image: frontend
            context: frontend
            file: frontend/Dockerfile
            module: ''

    steps:
      - uses: actions/checkout@v4

      - name: Buildx 설정
        # 레이어 캐시(type=gha)와 build-arg 캐시를 쓰려면 기본 빌더로는 안 된다
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그 만들기
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            # 브랜치 이름 — 항상 최신을 가리킨다(dev, main)
            type=ref,event=branch
            # 커밋 해시 — 배포에는 이쪽을 쓴다. 롤백할 때 무엇으로 돌아가는지 분명하다
            type=sha,format=long,prefix=sha-

      - name: 빌드 · 푸시
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 이미지별로 캐시를 나눈다. 섞으면 서로 밀어내서 매번 처음부터 빌드한다.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: 결과 요약
        run: |
          {
            echo "### \`${{ matrix.image }}\`"
            echo ''
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-batch:
    name: deploy app-batch
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_TASK_DEFINITION_FAMILY: ${{ vars.ECS_BATCH_TASK_DEFINITION }}
      EVENTBRIDGE_SCHEDULER_NAME: ${{ vars.EVENTBRIDGE_BATCH_SCHEDULER }}
      IMAGE: ghcr.io/${{ github.repository }}/app-batch:sha-${{ github.sha }}

    steps:
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: 배포 설정 검증
        run: |
          set -euo pipefail
          for value in AWS_REGION ECS_TASK_DEFINITION_FAMILY EVENTBRIDGE_SCHEDULER_NAME; do
            if [ -z "${!value}" ]; then
              echo "GitHub Actions variable $value is not configured" >&2
              exit 1
            fi
          done
          if [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "GitHub Actions secret AWS_DEPLOY_ROLE_ARN is not configured" >&2
            exit 1
          fi

      - name: 새 Batch Task Definition 등록
        id: task-definition
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION_FAMILY" \
            --query taskDefinition > task-definition.json

          jq --arg image "$IMAGE" '
            del(
              .taskDefinitionArn, .revision, .status, .requiresAttributes,
              .compatibilities, .registeredAt, .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == "otboo-batch" then .image = $image else . end
              )
          ' task-definition.json > task-definition-rendered.json

          arn="$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: EventBridge Scheduler 대상 갱신
        shell: bash
        env:
          TASK_DEFINITION_ARN: ${{ steps.task-definition.outputs.arn }}
        run: |
          set -euo pipefail
          aws scheduler get-schedule \
            --name "$EVENTBRIDGE_SCHEDULER_NAME" \
            --output json \
            | jq --arg task_definition_arn "$TASK_DEFINITION_ARN" '
                del(.Name, .Arn, .CreationDate, .LastModificationDate)
                | .Target.EcsParameters.TaskDefinitionArn = $task_definition_arn
              ' > scheduler-update.json

          aws scheduler update-schedule \
            --name "$EVENTBRIDGE_SCHEDULER_NAME" \
            --cli-input-json file://scheduler-update.json

          echo "Batch task definition: $TASK_DEFINITION_ARN"
