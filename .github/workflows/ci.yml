name: CI

on:
  pull_request:
    branches: [ main, dev, int ]
    # 프론트·문서만 바뀐 PR 에서는 백엔드 빌드를 돌리지 않는다.
    # frontend/ 에 199개 파일이 있어서 이게 없으면 오탈자 수정에도 5분씩 걸린다.
    paths-ignore:
      - 'frontend/**'
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.editorconfig'
  push:
    branches: [ main, dev, int ]
    paths-ignore:
      - 'frontend/**'
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.editorconfig'

# 같은 PR 에 연달아 푸시하면 이전 실행을 취소한다. 낡은 결과를 기다리지 않는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        # 의존성과 빌드 캐시를 자동으로 저장·복원한다
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 · 테스트
        # 통합 테스트가 Testcontainers 로 MySQL 을 띄운다. ubuntu 러너에는 Docker 가 있다.
        # 로컬과 같은 기준으로 돌려야 시간 관련 테스트가 여기서만 깨지지 않는다.
        env:
          TZ: UTC
        run: ./gradlew build --no-daemon

      - name: 테스트 결과 요약
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, re, os

          rows, total, failed = [], 0, 0
          for path in sorted(glob.glob('*/build/test-results/test/*.xml')):
              text = open(path, encoding='utf-8').read()
              m = re.search(r'tests="(\d+)"\s+skipped="(\d+)"\s+failures="(\d+)"\s+errors="(\d+)"', text)
              if not m:
                  continue
              tests, skipped, failures, errors = (int(g) for g in m.groups())
              if tests == 0:
                  continue  # @Nested 부모 클래스는 빈 결과 파일을 남긴다
              total += tests
              failed += failures + errors
              module = path.split('/')[0]
              name = os.path.basename(path)[5:-4].split('.')[-1]
              mark = '❌' if failures + errors else '✅'
              rows.append(f'| {mark} | `{module}` | {name} | {tests} | {failures + errors} | {skipped} |')

          if not rows:
              print('테스트 결과 파일이 없습니다.')
          else:
              print(f'## 테스트 {total}개 · 실패 {failed}개\n')
              print('| | 모듈 | 클래스 | 실행 | 실패 | 건너뜀 |')
              print('|---|---|---|---|---|---|')
              print('\n'.join(rows))
          PY

      - name: 실패 시 리포트 업로드
        # 요약만으로 원인을 못 찾을 때 HTML 리포트를 받아본다
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/test'
          retention-days: 7
